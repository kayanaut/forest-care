[project]
name = "forestcare"
version = "0.1.0"
description = "Prototype: robot-assisted monitoring of Prunus serotina in Bonn, with human verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pillow>=10.3",           # EXIF/GPS from field photos, display previews
    "python-multipart>=0.0.9", # browser upload of a photo folder
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    # Pinned to match the Chromium build already installed in ~/.cache/ms-playwright.
    "playwright==1.58.0",
    # ROS 2 gateway, offline parts (bag conversion, demo bags, localization analysis); see ros2/README.md
    "forestcare-gateway[offline]",
]

[tool.pytest.ini_options]
testpaths = ["tests", "ros2/forestcare_gateway/test"]
pythonpath = ["ros2/forestcare_gateway"]
markers = [
    "browser: end-to-end test that drives the web UI in headless Chromium",
    "ros: runs real ROS 2 nodes (needs /opt/ros/kilted and a colcon build of ros2/)",
]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.uv.sources]
forestcare-gateway = { path = "ros2/forestcare_gateway", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forestcare", "simulator"]
